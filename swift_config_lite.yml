# Configuración MÍNIMA para WSL - 24k partículas

InternalUnitSystem:
    UnitMass_in_cgs:        1e27
    UnitLength_in_cgs:      1e8
    UnitVelocity_in_cgs:    1e8
    UnitCurrent_in_cgs:     1
    UnitTemp_in_cgs:        1

InitialConditions:
    file_name:  lite_impact_IC.hdf5
    periodic:   0

TimeIntegration:
    time_begin:     0
    time_end:       20000               # ~5.5 horas de simulación
    dt_min:         0.00001
    dt_max:         100                 # Paso grande

Snapshots:
    subdir:         lite_simulation_output
    basename:       snapshot
    time_first:     0
    delta_time:     400                 # Cada ~6.5 minutos = ~50 snapshots

Statistics:
    time_first:     0
    delta_time:     1000

Restarts:
    enable:         0                   # Desactivado para ahorrar memoria

SPH:
    resolution_eta:     1.2348
    delta_neighbours:   0.1
    CFL_condition:      0.25
    h_max:              5.0
    viscosity_alpha:    1.0

Gravity:
    eta:                            0.05    # Más relajado
    MAC:                            geometric
    theta_cr:                       0.7     # Más tolerante
    max_physical_baryon_softening:  1.0

Scheduler:
    max_top_level_cells:    8           # Mínimo

EoS:
    # Tillotson materials (parameters hardcoded in SWIFT, no table files needed)
    planetary_use_Til_iron:     1   # Material ID 100 (core)
    planetary_use_Til_granite:  1   # Material ID 101 (mantle)
