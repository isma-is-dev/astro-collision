# Test para IC con formato limpio (sin aliases, uint64 IDs)

InternalUnitSystem:
    UnitMass_in_cgs:        1e27
    UnitLength_in_cgs:      1e8
    UnitVelocity_in_cgs:    1e8
    UnitCurrent_in_cgs:     1
    UnitTemp_in_cgs:        1

InitialConditions:
    file_name:  earth_IC_clean.hdf5
    periodic:   0

TimeIntegration:
    time_begin:     0
    time_end:       4000
    dt_min:         0.000001
    dt_max:         50

Snapshots:
    subdir:             settle_earth_clean_output
    basename:           snapshot
    time_first:         0
    delta_time:         200

Statistics:
    time_first: 0
    delta_time: 200

Restarts:
    enable: 0

SPH:
    resolution_eta:     1.2348
    delta_neighbours:   0.1
    CFL_condition:      0.2
    h_max:              1.0
    viscosity_alpha:    1.5

Gravity:
    eta:                            0.025
    MAC:                            adaptive
    epsilon_fmm:                    0.001
    theta_cr:                       0.5
    max_physical_baryon_softening:  0.16

Scheduler:
    max_top_level_cells:    16

EoS:
    # Tillotson materials
