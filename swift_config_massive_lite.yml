# Configuración LIGERA para impacto masivo en WSL
# Reduce uso de memoria para evitar "Failed to allocate task array"

InternalUnitSystem:
    UnitMass_in_cgs:        1e27
    UnitLength_in_cgs:      1e8
    UnitVelocity_in_cgs:    1e8
    UnitCurrent_in_cgs:     1
    UnitTemp_in_cgs:        1

InitialConditions:
    file_name:  massive_impact_IC.hdf5
    periodic:   0

TimeIntegration:
    time_begin:     0
    time_end:       50000               # ~14 horas de simulación (más corta)
    dt_min:         0.000001
    dt_max:         60                  # Timestep más grande = menos pasos

Snapshots:
    subdir:         massive_simulation_output
    basename:       snapshot
    time_first:     0
    delta_time:     600                # Snapshot cada 10 minutos = 50 snapshots

Statistics:
    time_first:     0
    delta_time:     1200

Restarts:
    enable:         1
    delta_time:     18000

SPH:
    resolution_eta:     1.2348
    delta_neighbours:   0.1
    CFL_condition:      0.2
    h_max:              3.0
    viscosity_alpha:    1.5

Gravity:
    eta:                            0.025
    MAC:                            adaptive
    epsilon_fmm:                    0.001
    theta_cr:                       0.5
    max_physical_baryon_softening:  0.5     # Mayor softening = menos cálculos

Scheduler:
    max_top_level_cells:    16          # MUCHO menor = menos memoria

EoS:
    # Tillotson materials (parameters hardcoded in SWIFT, no table files needed)
    planetary_use_Til_iron:     1   # Material ID 100 (core)
    planetary_use_Til_granite:  1   # Material ID 101 (mantle)
