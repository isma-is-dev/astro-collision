# Configuración CINEMATOGRÁFICA para animación larga de impacto
# Miles de snapshots para animación de ~1 hora

InternalUnitSystem:
    UnitMass_in_cgs:        1e27
    UnitLength_in_cgs:      1e8
    UnitVelocity_in_cgs:    1e8
    UnitCurrent_in_cgs:     1
    UnitTemp_in_cgs:        1

InitialConditions:
    file_name:  impact_IC.hdf5
    periodic:   0

TimeIntegration:
    time_begin:     0
    time_end:       10000               # ~2.7 horas de simulación física
    dt_min:         0.000001
    dt_max:         10                  # Paso pequeño = más precisión

Snapshots:
    subdir:         cinematic_output
    basename:       frame
    time_first:     0
    delta_time:     2                   # Snapshot CADA 2 SEGUNDOS de simulación

Statistics:
    time_first:     0
    delta_time:     100

Restarts:
    enable:         1
    delta_time:     5000

SPH:
    resolution_eta:     1.2348
    delta_neighbours:   0.1
    CFL_condition:      0.15            # Más conservador para mejor calidad
    h_max:              2.0
    viscosity_alpha:    1.5

Gravity:
    eta:                            0.025
    MAC:                            adaptive
    epsilon_fmm:                    0.001
    theta_cr:                       0.5
    max_physical_baryon_softening:  0.3

Scheduler:
    max_top_level_cells:    32

EoS:
    # Tillotson materials
